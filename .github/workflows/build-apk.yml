name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          RAW_VER=$(java -version 2>&1 | head -n 1)
          JAVA_VER=$(echo "$RAW_VER" | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java major version: $JAVA_VER"
          if ! [[ "$JAVA_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Java version could not be detected from: $RAW_VER"
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Active Java version ($JAVA_VER) confirmed 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: "Automated debug APK build from commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
